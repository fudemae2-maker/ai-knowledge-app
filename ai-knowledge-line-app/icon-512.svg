<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06c755" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3" />

  <!-- Brain / Knowledge Card Base -->
  <g transform="translate(60, 50)">
    <!-- Main Card Body -->
    <rect x="40" y="50" width="312" height="340" rx="36" fill="#1e293b" stroke="rgba(255,255,255,0.12)" stroke-width="3" />
    
    <!-- AI Sparkle Glow Icon Top-Right -->
    <path d="M 280 40 Q 300 40 300 20 Q 300 40 320 40 Q 300 40 300 60 Q 300 40 280 40 Z" fill="url(#glowGrad)" filter="url(#glow)"/>
    <path d="M 330 80 Q 340 80 340 70 Q 340 80 350 80 Q 340 80 340 90 Q 340 80 330 80 Z" fill="#38bdf8" />

    <!-- Card Header / Title lines -->
    <rect x="75" y="95" width="130" height="18" rx="9" fill="url(#glowGrad)" />
    <rect x="75" y="130" width="240" height="10" rx="5" fill="#475569" />
    <rect x="75" y="152" width="190" height="10" rx="5" fill="#334155" />

    <!-- Bullet Takeaways -->
    <circle cx="85" cy="195" r="7" fill="#06c755" />
    <rect x="105" y="190" width="180" height="10" rx="5" fill="#cbd5e1" />
    
    <circle cx="85" cy="230" r="7" fill="#06c755" />
    <rect x="105" y="225" width="210" height="10" rx="5" fill="#cbd5e1" />

    <circle cx="85" cy="265" r="7" fill="#38bdf8" />
    <rect x="105" y="260" width="150" height="10" rx="5" fill="#94a3b8" />

    <!-- LINE Share Badge in Bottom Right -->
    <g transform="translate(190, 230)">
      <circle cx="100" cy="100" r="64" fill="url(#lineGrad)" filter="url(#glow)" />
      <!-- LINE Chat Bubble Path -->
      <path d="M 100 64 C 74.6 64 54 80.2 54 100.1 C 54 112.5 61.9 123.3 73.9 129.7 C 75.3 130.4 75.8 131.5 75.4 133.1 C 74.4 137.4 72.3 145.4 71.9 147.2 C 71.5 149.3 73.3 150.3 74.9 149.2 C 86.8 141.5 95.8 135.5 98.4 133.7 C 98.9 133.3 99.4 133.2 100 133.2 C 125.4 133.2 146 117 146 97.1 C 146 77.2 125.4 64 100 64 Z" fill="#ffffff"/>
      <!-- Small Arrow or lightning inside speech bubble -->
      <path d="M 85 96 L 93 104 L 115 82" fill="none" stroke="#06c755" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
